<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madden 26 Franchise Control</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title" id="brand-title">Madden 26</div>
      <div class="brand-sub" id="brand-sub">Franchise Control</div>
      <div class="game-switch" title="Switch between your Madden 26 franchise and your FC 26 career"><button data-game="madden">Madden 26</button><button data-game="fc26">FC 26</button></div>
    </div>
    <nav id="nav">
      <div class="nav-group">League</div>
      <button data-section="connect">Connect</button>
      <button data-section="schedule">Schedule &amp; Injury Tool</button>
      <button data-section="teams">Teams</button>
      <button data-section="recap">Weekly Recap</button>
      <button data-section="highlights">Highlights</button>
      <button data-section="contracts">Contracts &amp; Cap</button>
      <div class="nav-group">Advanced Stats</div>
      <button data-section="blocking">Blocking</button>
      <button data-section="passrush">Pass Rush &amp; Missed Sacks</button>
      <button data-section="snaps">Snap Counts</button>
      <button data-section="receiving">Targets &amp; Drops</button>
      <button data-section="tackling">Missed Tackles</button>
      <button data-section="penalties">Penalties</button>
      <div class="nav-group">Tools</div>
      <button data-section="tracker">Game Tracker</button>
      <button data-section="injuries">Injury Report</button>
      <button data-section="settings">Settings</button>
    </nav>
    <nav id="fc-nav">
      <div class="nav-group">Career</div>
      <button data-fc-nav="connect">Connect</button>
      <button data-fc-nav="overview">Overview</button>
      <button data-fc-nav="tables">League Tables</button>
      <button data-fc-nav="clubs">Clubs</button>
      <button data-fc-nav="fixtures">Fixtures &amp; Results</button>
      <button data-fc-nav="transfers">Transfers</button>
      <button data-fc-nav="manager">Manager</button>
      <div class="nav-group">Stats</div>
      <button data-fc-nav="players">Player Stats</button>
      <button data-fc-nav="advanced">Advanced Stats</button>
      <div class="nav-group">Tools</div>
      <button data-fc-nav="matchlog">Match Log</button>
      <button data-fc-nav="settings">Settings</button>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <label class="field madden-only">
          <span>League</span>
          <select id="league-select"></select>
        </label>
        <label class="field fc-only">
          <span>Career</span>
          <select id="fc-career-select"></select>
        </label>
        <label class="field madden-only" id="stage-field">
          <span>Season part</span>
          <select id="stage-select">
            <option value="pre">Preseason</option>
            <option value="reg" selected>Regular season</option>
            <option value="post">Playoffs</option>
            <option value="all">Everything</option>
          </select>
        </label>
        <label class="field madden-only" id="week-field">
          <span>Week</span>
          <select id="week-select"><option value="">All weeks</option></select>
        </label>
        <label class="field madden-only" id="team-field">
          <span>Team</span>
          <select id="team-select"><option value="">All teams</option></select>
        </label>
      </div>
      <div class="topbar-right">
        <button id="btn-open-file" class="primary">Open franchise file</button>
        <button id="btn-copy-page" title="Copy everything on this page as plain text">Copy page</button>
        <button id="btn-refresh" title="Re-read the file / exports">Refresh</button>
      </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modal-root"></div>
<script src="fc26.js"></script>
<script src="app.js"></script>
</body>
</html>
