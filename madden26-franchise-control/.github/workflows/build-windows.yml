name: Build Windows exe

on:
  push:
    tags: ["v*"]
    paths: ["madden26-franchise-control/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: madden26-franchise-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Madden26FranchiseControl-windows
          path: |
            madden26-franchise-control/dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: madden26-franchise-control/dist/*.exe
