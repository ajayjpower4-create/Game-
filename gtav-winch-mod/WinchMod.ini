; GTA V Winch - drop this next to WinchMod.dll in your scripts\ folder.
; Press the ReloadConfigKey in game to apply changes without restarting.

[Keys]
AttachKey       = NumPad0     ; set point one, then point two
CutKey          = NumPad1     ; cut the rope you are looking at (or clear a pending point)
CutAllKey       = NumPad2
StrapKey        = NumPad3     ; strap the load to a tow bed / release it
SpoolInKey      = NumPad8     ; hold to reel in
SpoolOutKey     = NumPad5     ; hold to pay out
ReloadConfigKey = NumPad9

[Aiming]
AimRange            = 60      ; metres you can hook from
SnapToHooks         = true    ; snap to tow hooks and bumpers when you aim near them
SnapToHookDistance  = 0.75
CutPickDistance     = 0.7     ; how close your crosshair must be to a rope to cut it
TreatPropsAsAnchors = true    ; lampposts, bollards and street clutter hold instead of moving

[Rope]
RopeType    = 4               ; 4 is the thin tow rope
MinLength   = 0.8
MaxLength   = 30
SpoolSpeed  = 1.6             ; metres per second
NativeSlack = 1.15            ; engine rope stays this much longer than the winch length
MaxLines    = 6

[Solver]
Beta            = 0.18        ; how hard slack is taken up (higher = stiffer, twitchier)
Damping         = 1.0         ; 1.0 = no bounce along the rope
MaxPullSpeed    = 7           ; cap on correction speed, m/s
MaxDeltaV       = 1.6         ; most speed one end can gain in a single frame
TorqueAssist    = 0.35        ; share of the pull routed through real forces so loads swing
NoCrushDistance = 1.1         ; stop reeling in once the ends are this close
BreakUnderLoad  = true
BreakForce      = 260000      ; newtons before the line snaps
ReleaseTowedHandbrake = true  ; a towed car should roll, not skid on locked wheels
RagdollTowedPeds      = true  ; a roped ped goes limp instead of skating upright

[Mass]
VehicleDensity = 110          ; kg per cubic metre of bounding box
PropDensity    = 90
PedMass        = 90

[Bed]
BedLockEnabled    = true
AutoLockToBed     = true      ; latch automatically once the load is sitting on the deck
BedFloorHeight    = 0.75      ; deck height above the truck's lowest point
BedLengthFraction = 0.62      ; how far forward from the tail the deck runs
BedSideTolerance  = 0.45
BedLockSpeed      = 2.5       ; max relative speed when latching, m/s
BedSettleTime     = 0.6       ; seconds spent gliding into the resting pose
AnyVehicleCanCarry = false
CarrierModels     = flatbed,towtruck,towtruck2,slamtruck,mule,mule2,mule3,mule4,packer,phantom

[Hud]
ShowHud = true
