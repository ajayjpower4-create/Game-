# Builds the Windows desktop version of Building Design Simulator: a portable
# .exe and a .zip. Every build is published to the "desktop-latest" release,
# which anyone can download without signing in to GitHub; they are also on the
# run itself under "Artifacts", and a tag like v1.2.0 makes a version release.
name: Desktop build (Windows .exe)

on:
  push:
    # Branches must be listed alongside tags, or branch pushes are ignored.
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'public/building/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install three.js (repository root)
        run: npm ci

      - name: Install Electron and electron-builder
        working-directory: desktop
        run: npm ci

      - name: Build the .exe
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: BuildingDesignSimulator-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

      # An artifact can only be downloaded by someone signed in to GitHub, so
      # every build of this branch also goes to a release anyone can download.
      - name: Publish the download
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Building Design Simulator - latest Windows build
          body: |
            The portable Windows build, made from ${{ github.ref_name }} at ${{ github.sha }}.

            - **BuildingDesignSimulator-1.0.0-portable.exe** - download and run it; nothing to install.
            - **BuildingDesignSimulator-1.0.0-win-x64.zip** - the same thing unpacked, if you would rather keep a folder.

            Windows will warn that the app is unsigned: More info, then Run anyway.
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip

      - name: Attach to a version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
