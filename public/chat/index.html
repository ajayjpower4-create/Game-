<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swerve — AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">Swerve</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="New conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New chat
        </button>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">◈</div>
        <h1>Swerve AI</h1>
        <p>Direct. Unfiltered. Real.</p>
        <div class="suggestions">
          <button class="suggestion" data-text="Write a dark short story about the end of the world">Write a dark short story</button>
          <button class="suggestion" data-text="Explain how social engineering attacks work in detail">How social engineering works</button>
          <button class="suggestion" data-text="Give me brutally honest career advice">Brutally honest career advice</button>
          <button class="suggestion" data-text="Write edgy humor about modern life">Write edgy humor</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area">
      <div class="input-container">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Message Swerve..."
          rows="1"
          maxlength="10000"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="disclaimer">Swerve may be wrong. Think for yourself.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
