<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10221f">
  <title>Therapy Session Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- SETUP SCREEN -->
    <section class="setup" id="setup">
      <div class="setup-inner">
        <div class="brand">
          <span class="brand-icon">🛋️</span>
          <h1>Therapy Session<br>Simulator</h1>
          <p class="tagline">Run a session. Pick your seat. The AI plays the rest — unfiltered.</p>
        </div>

        <div class="setup-block">
          <h2>1. Who are you?</h2>
          <div class="role-grid">
            <button class="role-card" data-role="therapist">
              <span class="role-emoji">📝</span>
              <span class="role-name">The Therapist</span>
              <span class="role-sub">You run the session. AI is the client.</span>
            </button>
            <button class="role-card" data-role="client">
              <span class="role-emoji">😮‍💨</span>
              <span class="role-name">The Client</span>
              <span class="role-sub">You're on the couch. AI is the therapist.</span>
            </button>
          </div>
        </div>

        <div class="setup-block">
          <h2>2. Pick the focus <span class="hint">(one or more)</span></h2>
          <div class="therapy-grid" id="therapyGrid">
            <button class="therapy-chip" data-therapy="depression">Depression</button>
            <button class="therapy-chip" data-therapy="anger">Anger issues</button>
            <button class="therapy-chip" data-therapy="adhd">ADHD</button>
            <button class="therapy-chip" data-therapy="anxiety">Anxiety</button>
            <button class="therapy-chip" data-therapy="vaping">Vaping</button>
            <button class="therapy-chip" data-therapy="speech">Speech</button>
            <button class="therapy-chip" data-therapy="autism">Autism</button>
          </div>
        </div>

        <div class="setup-block">
          <h2 id="personalityHeading">3. Their personality</h2>
          <div class="therapy-grid" id="personalityGrid">
            <button class="therapy-chip" data-personality="hostile">Hostile</button>
            <button class="therapy-chip" data-personality="sarcastic">Sarcastic</button>
            <button class="therapy-chip" data-personality="withdrawn">Withdrawn</button>
            <button class="therapy-chip" data-personality="dramatic">Dramatic</button>
            <button class="therapy-chip" data-personality="chill">Chill</button>
            <button class="therapy-chip" data-personality="cheerful">Too cheerful</button>
            <button class="therapy-chip" data-personality="deadpan">Deadpan</button>
            <button class="therapy-chip" data-personality="unhinged">Unhinged</button>
          </div>
        </div>

        <button class="start-btn" id="startBtn" disabled>Start session</button>
        <p class="setup-note">Heads up: the AI swears a lot and stays fully in character. For entertainment only — not real therapy.</p>
      </div>
    </section>

    <!-- CHAT SCREEN -->
    <section class="session hidden" id="session">
      <header class="header">
        <div class="header-inner">
          <button class="back-btn" id="backBtn" title="End session">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <div class="header-title">
            <span class="header-main" id="headerMain">Session</span>
            <span class="header-sub" id="headerSub"></span>
          </div>
        </div>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="messages" id="messages"></div>
      </main>

      <footer class="input-area">
        <div class="input-container">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Say something..."
            rows="1"
            maxlength="10000"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
