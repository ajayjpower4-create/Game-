<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On The Clock — AI Job Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">⛏</span>
          <span class="logo-text">On The Clock</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="Quit shift">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Quit shift
        </button>
      </div>
    </header>

    <!-- SCREEN 1: Pick a job -->
    <main class="screen screen-jobs" id="screenJobs">
      <div class="hero">
        <div class="hero-icon">⛏</div>
        <h1>On The Clock</h1>
        <p>Clock in. Pick the gig. Run the shift. Unfiltered &amp; real — powered by Opus&nbsp;4.8.</p>
      </div>
      <div class="job-grid">
        <button class="job-card" data-job="garbage">
          <span class="job-emoji">🗑️</span>
          <span class="job-name">Garbage Collector</span>
          <span class="job-desc">Pick your crew, your route, and your role on the truck. Run the haul.</span>
        </button>
        <button class="job-card" data-job="gas">
          <span class="job-emoji">⛽</span>
          <span class="job-name">Gas Station Worker</span>
          <span class="job-desc">Set your store layout and coworkers. Deal with the customers that walk in.</span>
        </button>
        <button class="job-card" data-job="construction">
          <span class="job-emoji">🏗️</span>
          <span class="job-name">Construction Worker</span>
          <span class="job-desc">Pick the project, the crew, your trade, and the site. Build it.</span>
        </button>
        <button class="job-card" data-job="restaurant">
          <span class="job-emoji">🍽️</span>
          <span class="job-name">Restaurant Worker</span>
          <span class="job-desc">Pick your rank, name the place, set the menu, pick a layout &amp; your coworkers.</span>
        </button>
        <button class="job-card" data-job="fastfood">
          <span class="job-emoji">🍔</span>
          <span class="job-name">Fast Food Worker</span>
          <span class="job-desc">Same deal, but you type out your own store layout however you want.</span>
        </button>
      </div>
    </main>

    <!-- SCREEN 2: Setup the shift -->
    <main class="screen screen-setup" id="screenSetup" hidden>
      <div class="setup-card">
        <button class="back-btn" id="backBtn">← Pick a different job</button>
        <h2 id="setupTitle">Set up your shift</h2>
        <p class="setup-sub" id="setupSub"></p>
        <form id="setupForm" class="setup-form"></form>
        <button class="start-btn" id="startBtn">Clock In →</button>
      </div>
    </main>

    <!-- SCREEN 3: The shift (chat) -->
    <main class="screen screen-chat chat-area" id="chatArea" hidden>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area" id="inputArea" hidden>
      <div class="input-container">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Do something, say something... (try *grab the bin* or talk to your crew)"
          rows="1"
          maxlength="10000"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="disclaimer">It's a sim. Your call what happens on the clock.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
