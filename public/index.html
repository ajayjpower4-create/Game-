<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On The Clock — AI Job Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">⛏</span>
          <span class="logo-text">On The Clock</span>
        </div>
        <div class="header-actions" id="shiftActions" hidden>
          <button class="hbtn" id="saveBtn" title="Save your shift">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span class="hbtn-label">Save</span>
          </button>
          <button class="hbtn" id="recapBtn" title="Recap your shift">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span class="hbtn-label">Recap</span>
          </button>
          <button class="hbtn" id="newChatBtn" title="Quit shift">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="hbtn-label">Quit</span>
          </button>
        </div>
      </div>
    </header>
    <div class="toast" id="toast" hidden></div>

    <!-- SCREEN 1: Pick a job -->
    <main class="screen screen-jobs" id="screenJobs">
      <div class="hero">
        <div class="hero-icon">⛏</div>
        <h1>On The Clock</h1>
        <p>Clock in. Pick the gig. Run the shift. Unfiltered &amp; real — powered by Opus&nbsp;4.7.</p>
      </div>
      <div class="resume-banner" id="resumeBanner" hidden>
        <div class="resume-text">
          <strong>Saved shift found</strong>
          <span id="resumeMeta"></span>
        </div>
        <div class="resume-actions">
          <button class="resume-btn" id="resumeBtn">Resume</button>
          <button class="resume-discard" id="discardBtn" title="Delete saved shift">✕</button>
        </div>
      </div>
      <div class="job-grid">
        <button class="job-card" data-job="garbage">
          <span class="job-emoji">🗑️</span>
          <span class="job-name">Garbage Collector</span>
          <span class="job-desc">Pick your crew, your route, and your role on the truck. Run the haul.</span>
        </button>
        <button class="job-card" data-job="gas">
          <span class="job-emoji">⛽</span>
          <span class="job-name">Gas Station Worker</span>
          <span class="job-desc">Set your store layout and coworkers. Deal with the customers that walk in.</span>
        </button>
        <button class="job-card" data-job="construction">
          <span class="job-emoji">🏗️</span>
          <span class="job-name">Construction Worker</span>
          <span class="job-desc">Pick the project, the crew, your trade, and the site. Build it.</span>
        </button>
        <button class="job-card" data-job="restaurant">
          <span class="job-emoji">🍽️</span>
          <span class="job-name">Restaurant Worker</span>
          <span class="job-desc">Pick your rank, name the place, set the menu, pick a layout &amp; your coworkers.</span>
        </button>
        <button class="job-card" data-job="fastfood">
          <span class="job-emoji">🍔</span>
          <span class="job-name">Fast Food Worker</span>
          <span class="job-desc">Same deal, but you type out your own store layout however you want.</span>
        </button>
        <button class="job-card" data-job="crime">
          <span class="job-emoji">💰</span>
          <span class="job-name">Criminal</span>
          <span class="job-desc">Pick the score, your role, the crew, the car, and your guns &amp; tools. (Fiction.)</span>
        </button>
        <button class="job-card" data-job="school">
          <span class="job-emoji">🏫</span>
          <span class="job-name">Teacher / School Worker</span>
          <span class="job-desc">Tons of ranks, a preset staff, your school details. Deal with students &amp; parents.</span>
        </button>
        <button class="job-card" data-job="discord">
          <span class="job-emoji">💬</span>
          <span class="job-name">Discord Mod</span>
          <span class="job-desc">Pick your server, channels, and members. Type what you post in the chat.</span>
        </button>
        <button class="job-card" data-job="taxi">
          <span class="job-emoji">🚕</span>
          <span class="job-name">NYC Taxi / Rideshare</span>
          <span class="job-desc">Pick your company &amp; ride. Haul passengers and tear down NYC streets.</span>
        </button>
        <button class="job-card" data-job="warehouse">
          <span class="job-emoji">📦</span>
          <span class="job-name">Warehouse Worker</span>
          <span class="job-desc">Name the warehouse, pick your rank &amp; duties, set the staff. Add photos!</span>
        </button>
        <button class="job-card" data-job="scientist">
          <span class="job-emoji">🔬</span>
          <span class="job-name">Scientist</span>
          <span class="job-desc">Pick your lab, your field of science, and the tools you've got.</span>
        </button>
        <button class="job-card" data-job="sports">
          <span class="job-emoji">🏆</span>
          <span class="job-name">Sports Player</span>
          <span class="job-desc">Pick the sport, position, league &amp; coach. Your team is preset.</span>
        </button>
      </div>
    </main>

    <!-- SCREEN 2: Setup the shift -->
    <main class="screen screen-setup" id="screenSetup" hidden>
      <div class="setup-card">
        <button class="back-btn" id="backBtn">← Pick a different job</button>
        <h2 id="setupTitle">Set up your shift</h2>
        <p class="setup-sub" id="setupSub"></p>
        <form id="setupForm" class="setup-form"></form>

        <div class="field img-field">
          <label>Photos of where you work <span class="opt">(optional — shows Claude your real layout)</span></label>
          <button type="button" class="dropzone" id="setupDropzone">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Tap to add photos of your workplace</span>
          </button>
          <input type="file" id="setupImageInput" accept="image/*" multiple hidden>
          <div class="thumbs" id="setupThumbs"></div>
        </div>

        <button class="start-btn" id="startBtn">Clock In →</button>
      </div>
    </main>

    <!-- SCREEN 3: The shift (chat) -->
    <main class="screen screen-chat chat-area" id="chatArea" hidden>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area" id="inputArea" hidden>
      <div class="pending-thumbs" id="pendingThumbs"></div>
      <div class="input-container">
        <button class="attach-btn" id="attachBtn" title="Attach a photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <input type="file" id="chatImageInput" accept="image/*" multiple hidden>
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Narrate what you do or say... (you tell the story; the AI plays everyone else)"
          rows="1"
          maxlength="10000"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="disclaimer">It's a sim. You narrate; the AI is the characters.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
