<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King of the World Simulator</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">♛</span>
          <span class="logo-text">King of the World</span>
        </div>
        <div class="header-actions">
          <button class="new-chat-btn" id="saveBtn" title="Save game">Save</button>
          <button class="new-chat-btn" id="loadBtn" title="Load game">Load</button>
          <button class="new-chat-btn" id="newChatBtn" title="New game">New game</button>
        </div>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">♛</div>
        <h1>King of the World Simulator</h1>
        <p>It is 2050. You are the King. Robots run the world. Your family does not.</p>
        <div class="start-box">
          <input type="text" id="kingNameInput" class="name-input" placeholder="Enter your name, Your Majesty" maxlength="40" autocomplete="off">
          <button class="suggestion start-btn" id="startBtn">Start Game</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area">
      <div class="input-container">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Speak as the King..."
          rows="1"
          maxlength="10000"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <p class="disclaimer">King of the World Simulator — autosaves every 3 minutes.</p>
    </footer>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
