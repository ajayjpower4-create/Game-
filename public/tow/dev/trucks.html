<!doctype html>
<html><head><meta charset="utf-8"><title>Trucks</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}#info{position:fixed;left:10px;top:10px;color:#fff;font:14px sans-serif;background:#0008;padding:6px 10px}</style>
<script type="importmap">{"imports":{"three":"/tow/vendor/three/three.module.js","three/addons/":"/tow/vendor/three-addons/"}}</script>
</head><body><canvas id="c"></canvas><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Renderer } from '../js/renderer.js';
import { TRUCKS, buildTowTruck, poseBed } from '../js/vehicles/towtruck.js';
import { buildInterior } from '../js/vehicles/interior.js';
import * as TX from '../js/textures.js';
const params = new URLSearchParams(location.search);
const R = new Renderer(document.getElementById('c'), params.get('q') || 'high');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb3c8);
const pm = new THREE.PMREMGenerator(R.renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);
R.camera = cam; R.resize();
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(10, 16, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
scene.add(sun, new THREE.HemisphereLight(0xcfe3ff, 0x3a3530, 0.5));
const asp = TX.cloneSet(TX.asphalt(), 10, 10);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ ...asp, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ids = (params.get('ids') || TRUCKS.map(t=>t.id).join(',')).split(',');
const liv = +(params.get('liv') || 0);
const trucks = [];
ids.forEach((id, i) => {
  const t = TRUCKS.find(t => t.id === id);
  const truck = buildTowTruck(t, liv);
  truck.root.position.x = (i - (ids.length - 1) / 2) * 4.2;
  truck.root.rotation.y = +(params.get('rot') || 0);
  const tilt = +(params.get('tilt') || 0);
  poseBed(truck, tilt * t.maxTilt, (+(params.get('slide') || 0)) * t.bed.slideMax);
  const inter = buildInterior(t, truck);
  truck.root.add(inter.group);
  if (params.get('open')) truck.toolboxes.forEach(tb => tb.doorPivot.rotation.z = tb.side * -1.4);
  scene.add(truck.root);
  trucks.push({ truck, inter });
});
window.trucks = trucks;
const controls = new OrbitControls(cam, R.canvas);
window.setView = (c, t) => { cam.position.set(...c); controls.target.set(...t); controls.update(); };
setView((params.get('cam') || '14,6,14').split(',').map(Number), (params.get('target') || '0,1.2,0').split(',').map(Number));
R.buildComposer(scene, cam);
function loop() { requestAnimationFrame(loop); R.render(scene, cam); }
loop();
window.ready = true;
</script></body></html>
