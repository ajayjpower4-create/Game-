<title>Police Form Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A patrol-car style terminal for writing incident reports, citations and arrest reports, then printing them as formal forms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: MDT shell — dark status bar on top, function rail on the left, form canvas in the middle,
   charge panel docked on the right (a full-screen sheet on phones). Paper forms are always white. */
:root{
  --bg:#e7ebf0; --panel:#ffffff; --panel-2:#f2f5f8; --field:#f8fafc; --line:#d3dae3; --line-2:#b8c2ce;
  --fg:#122033; --muted:#58687d; --accent:#1c58cf; --accent-fg:#ffffff; --accent-soft:#e1e9fa;
  --amber:#8f5b00; --amber-soft:#fbf0d9; --red:#b8232a; --red-soft:#fbe3e4; --green:#13784a; --green-soft:#ddf1e6;
  --bar:#141f33; --bar-2:#1d2b45; --bar-fg:#e4ebf5; --bar-muted:#93a3ba;
  --shadow:0 1px 2px rgba(18,32,51,.06),0 6px 18px rgba(18,32,51,.06);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-type:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --panel:#121a27; --panel-2:#172134; --field:#0e1522; --line:#233149; --line-2:#33445f;
  --fg:#dbe4f1; --muted:#8798b0; --accent:#5f97ff; --accent-fg:#06101f; --accent-soft:#16284a;
  --amber:#f1b54c; --amber-soft:#382a10; --red:#ff6f6f; --red-soft:#3b1619; --green:#4fd28c; --green-soft:#11301f;
  --bar:#070b12; --bar-2:#111a29; --bar-fg:#dbe4f1; --bar-muted:#8394ab;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b111b; --panel:#121a27; --panel-2:#172134; --field:#0e1522; --line:#233149; --line-2:#33445f;
  --fg:#dbe4f1; --muted:#8798b0; --accent:#5f97ff; --accent-fg:#06101f; --accent-soft:#16284a;
  --amber:#f1b54c; --amber-soft:#382a10; --red:#ff6f6f; --red-soft:#3b1619; --green:#4fd28c; --green-soft:#11301f;
  --bar:#070b12; --bar-2:#111a29; --bar-fg:#dbe4f1; --bar-muted:#8394ab;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* ---------- status bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--bar-2)}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.tb-seal{width:38px;height:38px;color:var(--bar-fg);flex:none}
.tb-seal svg{display:block;width:38px;height:38px}
.tb-brand b{display:block;font:700 17px/1.05 var(--f-cond);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.tb-brand small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--bar-muted);letter-spacing:.06em;text-transform:uppercase}
.tb-who{display:flex;gap:16px;align-items:center;font:500 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.tb-who span{display:flex;flex-direction:column;gap:2px}
.tb-who i{font-style:normal;font:600 10px/1 var(--f-cond);letter-spacing:.12em;color:var(--bar-muted)}
.tb-status{display:flex;align-items:center;gap:8px;background:var(--bar-2);border:1px solid #2c3d5c;border-radius:4px;padding:0 4px 0 10px}
.led{width:9px;height:9px;border-radius:50%;background:#45d483;box-shadow:0 0 8px #45d483;flex:none}
.led[data-s="10-6"]{background:#f1b54c;box-shadow:0 0 8px #f1b54c}
.led[data-s="10-97"]{background:#5f97ff;box-shadow:0 0 8px #5f97ff}
.led[data-s="10-15"]{background:#ff6f6f;box-shadow:0 0 8px #ff6f6f}
.led[data-s="10-7"]{background:#8394ab;box-shadow:none}
.tb-status select{background:transparent;border:0;color:var(--bar-fg);font:600 12px var(--f-mono);text-transform:uppercase;padding:8px 4px;min-height:34px;color-scheme:dark}
.tb-status select option{background:#111a29;color:#dbe4f1}
.tb-clock{text-align:right;font-family:var(--f-mono)}
.tb-clock b{display:block;font:600 18px/1 var(--f-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tb-clock small{font:500 11px/1.2 var(--f-mono);color:var(--bar-muted);text-transform:uppercase}
.tb-theme{background:var(--bar-2);border:1px solid #2c3d5c;color:var(--bar-fg);border-radius:4px;min-height:34px;padding:0 10px;
  font:600 12px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tb-theme:hover{border-color:#5f97ff}

/* ---------- shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:22px;max-width:1640px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.rail-h{font:600 11px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
.nav{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:1px solid transparent;border-radius:5px;padding:9px 10px;cursor:pointer;color:var(--fg)}
.nav:hover{background:var(--panel)}
.nav[aria-current="page"]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.nav-k{font:600 11px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:4px 0;text-align:center}
.nav[aria-current="page"] .nav-k{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nav-t{font:600 15px/1.15 var(--f-cond);letter-spacing:.03em;text-transform:uppercase}
.nav-c{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px}
.nav-c.todo{background:var(--amber-soft);color:var(--amber)}
.nav-c.done{background:var(--green-soft);color:var(--green)}
.rail-note{margin-top:14px;padding:10px;font-size:12.5px;line-height:1.4;color:var(--muted);border-top:1px solid var(--line)}
main{min-width:0}

/* ---------- doc header */
.doc-h{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.doc-h h1{font:700 34px/1 var(--f-cond);letter-spacing:.02em;text-transform:uppercase;margin:4px 0 6px}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 13px var(--f-mono);color:var(--muted)}
.doc-meta b{color:var(--fg);font-weight:600}
.saved{color:var(--green)}
.saved.bad{color:var(--red)}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;margin-bottom:16px;border-radius:6px;
  background:var(--accent-soft);border:1px solid var(--line-2);font-size:14px}
.banner p{margin:0;flex:1 1 320px;min-width:0}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:8px 13px;border-radius:4px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--fg);cursor:pointer;
  font:600 13.5px/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:5px 10px;font-size:12.5px}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- sections & fields */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0;scroll-margin-top:90px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 14px;background:var(--panel-2);
  border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.sec-n{font:600 12px/1 var(--f-mono);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:4px 6px}
.sec-h h2{margin:0;font:700 17px/1.1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.sec-tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.sec-b{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px 14px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.sfull{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font:600 12px/1.15 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld.req>span::after{content:" *";color:var(--red)}
input,select,textarea,output.out{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line-2);border-radius:4px;
  background:var(--field);color:var(--fg);font-size:14.5px}
output.out{display:flex;align-items:center;background:var(--panel-2);font-family:var(--f-mono)}
textarea{resize:vertical;line-height:1.55;font-family:var(--f-type);font-size:15px;min-height:120px}
input.mono{font-family:var(--f-mono);letter-spacing:.03em}
input[readonly]{background:var(--panel-2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld.inline{flex-direction:row;align-items:center;gap:8px}
.fld.inline>span{white-space:nowrap}
.fld.inline select{width:auto}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.chk{display:flex;align-items:center;gap:9px;min-height:34px;cursor:pointer;font-size:14.5px}
.chk input{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--accent);flex:none}
.empty{margin:0;padding:14px;border:1px dashed var(--line-2);border-radius:5px;color:var(--muted);font-size:14px}
.rep{border:1px solid var(--line);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.rep-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rep-h b{font:700 14px var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
.rep-sum{font:500 13px var(--f-mono);color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.import{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.import select{width:auto;flex:1 1 200px;min-width:0}
.hint{margin:0;font-size:13px;color:var(--muted)}
.flash{animation:none}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
}

/* ---------- charges on the form */
.work{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:20px;align-items:start}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.crow-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px}
.crow-main .code{font:500 12px var(--f-mono);color:var(--muted)}
.crow-main .ct{font-size:15px;line-height:1.3;font-weight:500}
.crow-tags{display:flex;gap:6px;flex-wrap:wrap}
.crow-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;font:600 11.5px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mini select,.mini input{width:auto;min-height:32px;padding:4px 6px;font-size:13.5px}
.mini input{width:62px}
.amt{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.x{width:32px;height:32px;border-radius:4px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.x:hover{color:var(--red);border-color:var(--red)}
.pill{display:inline-flex;align-items:center;font:600 11px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.f{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.m{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.k{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.totals{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:5px;background:var(--panel-2);border:1px dashed var(--line-2)}
.totals>div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.totals>div b{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.totals .grand{border-top:1px solid var(--line-2);margin-top:6px;padding-top:9px}
.totals .grand span{font:700 17px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.totals .grand b{font-size:20px;color:var(--accent)}
.fine-note{margin:6px 0 0;font-size:13px;color:var(--muted)}
.enh{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px}
.enh .chk em{font-style:normal;font:600 12px var(--f-mono);color:var(--muted);margin-left:auto}
.photo-up{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo-prev{width:72px;height:90px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;
  font:600 10px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;overflow:hidden}
.photo-prev img{width:100%;height:100%;object-fit:cover}

/* ---------- charge panel */
.cpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.cp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bar);color:var(--bar-fg)}
.cp-h h2{margin:0;font:700 17px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
.cp-count{font:500 11.5px var(--f-mono);color:var(--bar-muted);margin-top:4px}
.cp-close{display:none;margin-left:auto;background:var(--bar-2);color:var(--bar-fg);border-color:#2c3d5c}
.cp-s{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-s input{min-height:44px;font-size:15.5px;font-family:var(--f-ui)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-right:1px solid var(--line-2);background:transparent;padding:8px 12px;min-height:36px;cursor:pointer;
  font:600 13px/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--fg)}
.seg button:last-child{border-right:0}
.seg button span{font:500 11px var(--f-mono);color:var(--muted);margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.8}
.seg.sm button{padding:7px 9px;font-size:12px}
.cp-list{overflow-y:auto;flex:1;min-height:180px;overscroll-behavior:contain}
.cp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;width:100%;padding:10px 14px;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg)}
.cp-row:hover,.cp-row:focus-visible{background:var(--accent-soft);outline:none}
.cp-row .code{font:500 11.5px/1.3 var(--f-mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-row .meta{font:600 12.5px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cp-row .t{font-size:14.5px;line-height:1.3;min-width:0}
.cp-row .add{align-self:end;font:700 11.5px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.cp-row.added .add{color:var(--green)}
.cp-row mark{background:var(--amber-soft);color:inherit;border-radius:2px}
.cp-foot{padding:9px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel-2)}
.cp-empty{padding:18px 14px;color:var(--muted);font-size:14px}

/* ---------- form creator */
.creator-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-radius:6px;margin-bottom:18px;
  background:var(--amber-soft);border:1px solid var(--amber);font-size:14px}
.notice.ok{background:var(--green-soft);border-color:var(--green)}
.chipbtn{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--fg)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:28px;min-width:0;width:100%}

/* ---------- paper */
.paper{--ink:#111;--rule:#1b1b1b;--red-ink:#b3121b;width:816px;min-height:1056px;flex:none;background:#fff;color:var(--ink);
  padding:30px 38px 22px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.16);font-family:var(--f-cond);display:flex;flex-direction:column;text-align:left}
.pcopy{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:600 9px/1 var(--f-cond);letter-spacing:.18em;text-transform:uppercase;color:#444}
.pcopy b{color:var(--red-ink);border:1.5px solid var(--red-ink);padding:3px 9px;letter-spacing:.22em;font-weight:700}
.ph{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding-bottom:10px;border-bottom:3px double var(--rule)}
.ph-seal{color:#111;width:80px;height:80px}
.ph-seal svg{display:block;width:80px;height:80px}
.ph-state{font:600 10px/1.2 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:#555}
.ph-name{font:700 23px/1.05 var(--f-cond);letter-spacing:.02em;text-transform:uppercase;margin:2px 0 3px}
.ph-addr,.ph-ori{font:500 10.5px/1.35 var(--f-cond);letter-spacing:.04em;color:#333;text-transform:uppercase}
.ph-form{border:2px solid var(--rule);padding:7px 10px 6px;text-align:right;min-width:214px}
.ph-title{font:700 21px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.ph-sub{font:600 9px/1.3 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:#444;margin-top:3px}
.ph-num{display:flex;justify-content:flex-end;align-items:baseline;gap:7px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100vw - 32px));
