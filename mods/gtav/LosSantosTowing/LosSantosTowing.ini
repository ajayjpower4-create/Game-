; Los Santos Towing - settings
; Drop this next to LosSantosTowing.dll in GTA V\scripts\.
; The script rewrites this file on load, so any key you delete comes back with
; its default value.

[keys]
; Clock on and off the tow board.
ToggleDutyKey = F5
; Answer or pass on the call that is ringing.
AcceptKey = Y
DeclineKey = N
; Cycle the amber lights: off -> steady -> slow flash.
ElsKey = L
; Have a stock tow truck sent out to you (set AllowTruckRequest = False to disable).
RequestTruckKey = F6
; Stand where you want a drop-off to be and press this: the nearest garage in
; the list below moves to your feet and is saved here.
CaptureGarageKey = F11
; The towing menu. With MenuNeedsShift on, this is Shift + M.
MenuKey = M
MenuNeedsShift = True

[dispatch]
; Seconds after clocking on before the first call.
FirstCallSeconds = 60
; Seconds between calls after that.
CallGapSeconds = 45
; How far away calls are placed, in metres.
MinCallDistance = 250
MaxCallDistance = 1400
; How close you have to get before the customer starts talking.
SceneRadius = 22
; How close to the garage counts as delivered.
DropRadius = 18

[job]
; How many chains/straps a load needs before it is properly secured.
ChainsRequired = 4
; Scales every payout.
PayMultiplier = 1.0
; Drive badly with a half-secured load and it can come off the back.
UnsecuredLoadsFall = True
; Prop used for coning off a scene. Any prop name works; if the model is not
; found the cone step is skipped rather than blocking the job.
ConeModel = prop_roadcone02a
; Whether F6 can send a stock tow truck out to you.
AllowTruckRequest = True

[yard]
; Which entry in [garages] is the yard you start shifts at.
YardGarage = yard
; Which stock truck the yard hands you: towtruck2 (the modern one),
; towtruck (the old one), or flatbed.
YardTruck = towtruck2
; Which way you and the truck face when you arrive.
YardHeading = 90
; Clocking on fades out and puts you at the yard. Set False to just start
; wherever you happen to be standing.
TeleportToYard = True

[debug]
; Writes LosSantosTowing.log next to the dll. Leave this on until it is stable.
LogToFile = True
; The custom checklist and ground markers. Turn this off if the HUD ever
; misbehaves - notifications, subtitles and prompts keep working.
RichHud = True

[hud]
; Grey blips for every drop-off while you are on duty.
ShowGarageBlips = True
; Clock on the moment the game loads.
StartOnDuty = False

[garages]
; "x, y, z" for each drop-off, and the name shown on the blip. These are
; starting points - stand on the exact spot you want and press the capture key
; to overwrite one.
burton = -337.00, -136.00, 39.00
burton_name = Los Santos Customs, Burton
lamesa = 731.00, -1089.00, 22.20
lamesa_name = Los Santos Customs, La Mesa
airport = -1155.00, -2007.00, 13.20
airport_name = Los Santos Customs, the airport
bennys = -205.00, -1310.00, 31.30
bennys_name = Benny's Original Motor Works
beekers = 1175.00, 2640.00, 37.80
beekers_name = Beeker's Garage, Route 68
paleto = 105.00, 6620.00, 31.90
paleto_name = Los Santos Customs, Paleto Bay
impound = 409.00, -1622.00, 29.30
impound_name = Davis impound lot
yard = 900.00, -2270.00, 30.50
yard_name = The yard, Cypress Flats
